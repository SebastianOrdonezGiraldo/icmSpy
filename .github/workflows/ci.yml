name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Base desechable para las pruebas de integración (nombre *_test obligatorio).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: icmspy
          POSTGRES_PASSWORD: icmspy
          POSTGRES_DB: icmspy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U icmspy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @icmspy/api test
        env:
          TEST_DATABASE_URL: postgres://icmspy:icmspy@localhost:5432/icmspy_test
      - run: pnpm build
