# Proyecto Docker independiente: no comparte red, volúmenes ni base de datos
# con icm-website ni con ningún otro servicio del VPS.
name: icmspy

x-app: &app
  build: .
  image: icmspy:latest
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgres://icmspy:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@postgres:5432/icmspy
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Define BETTER_AUTH_SECRET en .env}
    APP_URL: ${APP_URL:?Define APP_URL en .env}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: icmspy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: icmspy
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sin puertos publicados: solo se alcanza desde la red interna de Docker.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icmspy -d icmspy"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 1g }

  # Aplica las migraciones y termina. API y worker esperan a que acabe bien.
  migrate:
    <<: *app
    restart: "no"
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports:
      # Solo en localhost: el Nginx del VPS es quien lo expone a internet.
      - "127.0.0.1:${API_PORT:-3020}:3020"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3020/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { memory: 512m }

  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        # Tope para que el crawler nunca compita con el sitio web.
        limits: { memory: 2g, cpus: "2" }

volumes:
  pgdata:
